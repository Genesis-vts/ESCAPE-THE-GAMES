name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Permite reexecutar a esteira manualmente pela aba Actions, sem precisar de
  # um commit vazio. Útil quando uma execução falha por causa do ambiente e não
  # do código — foi o caso das execuções anteriores à abertura do repositório.
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch — economiza minutos de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: services/api — lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint --workspace services/api

      - name: Typecheck
        run: npm run typecheck --workspace services/api

      - name: Testes com cobertura
        run: npm run test:coverage --workspace services/api
        env:
          # Segredo fictício, exclusivo do runner. Nenhuma credencial real no CI:
          # sem TWILIO_*/SENDGRID_*, a API usa os adaptadores de console.
          JWT_SECRET: ci-secret-com-mais-de-32-caracteres-para-o-runner
          NODE_ENV: test

      - name: Build
        run: npm run build --workspace services/api

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: services/api/coverage/
          retention-days: 7

  formatacao:
    name: Formatação (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  seguranca:
    name: Segurança — dependências e varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # BLOQUEANTE: dependências que vão para produção. É o que roda em runtime
      # e é alcançável por um atacante — nenhuma vulnerabilidade alta/crítica passa.
      # SLA em SECURITY_AND_COMPLIANCE.md §6.
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=high

      # INFORMATIVO: ferramentas de build (eslint, jest, tsx). Não bloqueia porque
      # hoje há advisories transitivas sem correção disponível fora de major
      # (brace-expansion <=5.0.7 via minimatch, puxado por jest/ts-jest). O relatório
      # fica visível no log e é revisado a cada release — ver SECURITY_AND_COMPLIANCE.md §6.
      - name: npm audit (dependências de desenvolvimento — informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Nenhum segredo pode entrar no repositório — só .env.example é versionado.
      #
      # Usamos o binário oficial em vez da gitleaks-action: a action exige licença
      # paga para repositórios de organização, enquanto o gitleaks em si é livre.
      # Versão fixada para que a varredura seja reprodutível.
      - name: Varredura de segredos (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `git` varre todo o histórico; `--redact` impede que qualquer valor
          # encontrado seja impresso no log público do CI.
          /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  docker:
    name: Build da imagem da API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build (sem push)
        run: docker build -f services/api/Dockerfile -t escape-api:ci .
